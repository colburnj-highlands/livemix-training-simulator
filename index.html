<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c1921">
  <meta name="description" content="Highlands Production — Livemix Pro Simulator training access.">
  <title>Training access — Highlands Production</title>
  <link rel="icon" href="./assets/branding/highlands-logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/site.css">
  <script src="./assets/site-config.js" defer></script>
  <script src="./assets/site.js" defer></script>
</head>
<body>
  <header class="app-header">
    <div class="brand"><img class="highlands-logo" src="./assets/branding/highlands-logo.svg" alt="" width="52" height="44"><span>Highlands Production</span></div>
    <span class="header-title">Livemix Pro Simulator</span>
  </header>
  <main class="gate" aria-labelledby="gate-title">
    <section class="gate-card">
      <p class="eyebrow">TRAINING ACCESS</p>
      <h1 id="gate-title">Livemix Pro Simulator</h1>
      <p class="intro">Enter your four-digit training PIN to start practicing.</p>
      <form id="pin-form">
        <label for="pin">Training PIN</label>
        <input id="pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" minlength="4" autocomplete="off" required aria-describedby="pin-help pin-error">
        <p id="pin-help" class="help">Use the PIN shared by your training team.</p>
        <p id="pin-error" class="error" role="alert"></p>
        <button type="submit">Unlock simulator</button>
      </form>
      <noscript><p>JavaScript is required to use the training PIN screen.</p></noscript>
    </section>
  </main>
  <footer>Independent browser training simulation. No audio processing or connection to physical equipment.</footer>
</body>
</html>
